## This file defines the configuration for odss2dash.

## To get platform and position information:
odssApi = "https://odss.mbari.org/odss"

## Server port to listen for requests:
port = 3033

## External URL of the odss2dash service
externalUrl = "http://localhost:3033"
#externalUrl = "https://okeanids.mbari.org/odss2dash"

## Interval to perform the dispatch:
pollPeriod = "30 seconds"

## Timeout for the requests to the ODSS API.
## Keep it below the timeout of the clients (Dash4 uses 15s), so a slow
## ODSS is reported by this service instead of the client just giving up:
odssTimeout = "10 seconds"

## Timeout for a POST to a TethysDash instance.
## An instance that does not answer is left alone for the rest of the
## dispatch cycle, so this is paid at most once per instance per cycle:
tethysdashTimeout = "10 seconds"

## For the requests polled by the clients: how far back a request for the latest positions
## looks. Such a request is not delimiting a period, but asking for the latest positions as
## of a moment, and left without a lower bound it would make ODSS return the complete track
## of the platform (over 100MB for some ships), so this window is used to derive one:
defaultPositionsWindow = "7 days"

## How many platforms a dispatch cycle handles at a time. ODSS answers 8 of these requests
## at once about as fast as it answers two, and a cycle is a hundred or so of them. Lower
## it to be gentler on ODSS:
dispatchConcurrency = 8

## For the real time dispatch: how far back the dispatcher may look when it resumes. Its
## requests start from the position it last reported, but never from further back than
## this, so that coming back from an outage does not replay everything that happened
## meanwhile:
dispatchCatchUpWindow = "1 hour"

## Ceiling for the numberOfPoints requested to ODSS for a period, so that not even a
## short period with a pathological reporting rate can produce an unbounded response:
maxNumberOfPoints = 20000

## Target TethysDash instances:
## For each:
##  `name`: A simple, alphanumeric string
##  `api`: The TehysDash API endpoint
##  `apiKey`: Use `$EV` syntax to indicate environment variable with the key.
##            A local `.env` file can be used to capture such variables.
#[[tethysdashes]]
#name = "okeanids"
#api = "https://okeanids.mbari.org/TethysDash/api"
#apiKey = "$OKEANIDS_APIKEY"

[[tethysdashes]]
name = "tethystest"
api = "http://tethystest.shore.mbari.org/TethysDash/api"
apiKey = "$TETHYSTEST_APIKEY"
