odssApi = "https://odss.mbari.org/odss"
port = 3033

externalUrl = "http://localhost:3033"

pollPeriod = "30 seconds"

odssTimeout = "20 seconds"
tethysdashTimeout = "5 seconds"
defaultPositionsWindow = "2 days"
dispatchConcurrency = 3
dispatchCatchUpWindow = "15 minutes"
maxNumberOfPoints = 2000

[[tethysdashes]]
name = "okeanids"
api = "https://okeanids.mbari.org/TethysDash/api"
apiKey = "$OKEANIDS_APIKEY"

[[tethysdashes]]
name = "tethystest"
api = "http://tethystest.shore.mbari.org/TethysDash/api"
apiKey = "$TETHYSTEST_APIKEY"
